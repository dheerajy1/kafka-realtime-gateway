services:
  kafka-api-gateway:
    container_name: kafka-api-gateway

    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: kafka-api-gateway:latest

    restart: unless-stopped

    # The gateway forces exit at 8 s, this leaves headroom for the WebSocket close frames
    stop_grace_period: 15s

    env_file:
      - ../.env.production

    ports:
      - "8089:8089"

    network_mode: bridge

    extra_hosts:
      - "host.docker.internal:host-gateway"