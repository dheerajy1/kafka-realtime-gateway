[package]
name = "kafka-api-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["xtask"]

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors"] }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-ssr = "0.7"
dotenvy = "0.15"
envy = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
validator = { version = "0.21", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bcrypt = "0.19"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
uuid = { version = "1", features = ["v7"] }
utoipa = "6"
utoipa-scalar = { version = "0.4", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
async-trait = "0.1.92"
getrandom = "0.4.3"
kafkit-client = "0.1.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
